apiVersion: batch/v1
kind: Job
metadata:
  name: my-job
  namespace: ${namespace}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: my-job
          image: busybox:1.36
          command: ["sh", "-c", "echo hello"]
