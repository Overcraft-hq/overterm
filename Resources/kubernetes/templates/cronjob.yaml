apiVersion: batch/v1
kind: CronJob
metadata:
  name: my-cronjob
  namespace: ${namespace}
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: my-cronjob
              image: busybox:1.36
              command: ["sh", "-c", "date"]
