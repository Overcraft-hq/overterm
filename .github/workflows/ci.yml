# CI: formatted, built and unit-tested on the toolchain the Release workflow
# ships with — Xcode 27.2, Swift 6.4, the one Overterm is developed with — so
# what would stop a release stops the commit instead. (A test that the
# release's Swift couldn't compile reached main and was found only by the
# release.)
#
# The macOS jobs run on GitHub's `xcode-27` image (macOS 27), a public
# preview: Xcode 27.1 is its default, so 27.2 is selected by path. XCODE below
# names it once for xcode-select and every cache key — a new Xcode restores
# no build made by another. The Release workflow uses the same keys.
#
# Pull requests, and pushes to main too: the repository is public, so the
# macOS minutes cost nothing, and commits land on main without a pull request
# — the one above did. On a pull request a newer push cancels the older run;
# on main every commit's run goes to the end (its group is the commit): a
# cancelled one saved no cache and left Release waiting on "CI is cancelled".
#
# The end-to-end scenarios (make e2e) open windows and are not run here;
# docs/testing.md has them, run before calling a change done.
#
# Two machines at once: the unit tests (`test`) and the release bundle
# (`bundle`), each with its own build cache — together they took ≈45 min in
# a row, apart the longer of the two. `changes` says what each needs: docs
# alone run nothing, a change outside the app skips the bundle, and a pull
# request runs the tests its changes reach (Scripts/affected-tests.sh);
# main runs every test (docs/testing.md, Choosing tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      test_workers:
        description: Unit-test processes run at once (Scripts/unit-tests.sh)
        required: false
        default: '4'

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# The Xcode both macOS jobs select, and their caches' keys (release.yml's too).
env:
  XCODE: "27.2"

jobs:
  # The pre-commit hook's rule (CLAUDE.md, Commits), for contributors who
  # never ran `make hooks`: a change to the app goes into a version not yet
  # released — VERSION past the newest v* tag — with its CHANGELOG.md entry.
  version:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: An app change goes into an unreleased version
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          if ! grep -qE '^(Sources/|Resources/|Scripts/|Package\.swift$|Package\.resolved$|Makefile$|mise\.toml$)' <<<"$changed"; then
            echo "No app change: the version stays."; exit 0
          fi
          new="$(tr -d '[:space:]' < VERSION)"
          released="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [[ -n "$released" && "$(printf '%s\n%s\n' "$released" "$new" | sort -V | tail -1)" == "$released" ]]; then
            echo "::error::This changes the app but VERSION is $new and v$released is released — start the next version: Scripts/bump-version.sh patch \"<subject>\" (CLAUDE.md, Commits)"; exit 1
          fi
          if ! grep -q "^## $new " CHANGELOG.md; then
            echo "::error::VERSION is $new but CHANGELOG.md has no entry for it — Scripts/bump-version.sh writes both"; exit 1
          fi
          echo "VERSION $new, past v${released:-nothing}"

  # What the change needs: the tests (all, none, or a filter) and the bundle.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.what.outputs.tests }}
      bundle: ${{ steps.what.outputs.bundle }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What changed
        id: what
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            # --no-renames: a moved file is its old path gone and its new one,
            # so a Sources file moved away still says `all`.
            pull_request) changed="$(git diff --name-only --no-renames "$BASE"...HEAD)" ;;
            push)
              # A new branch, or a push git can't see the start of: everything.
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                changed="$(git ls-files)"
              else
                changed="$(git diff --name-only --no-renames "$BEFORE" HEAD)"
              fi ;;
            *) changed="$(git ls-files)" ;;
          esac
          printf '%s\n' "$changed"
          # The bundle: what goes into the app (the version rule's paths, which
          # hold Scripts/make-dmg.sh), and every workflow — release.yml builds
          # the same bundle, so an edit to it is checked before a release is.
          if grep -qE '^(Sources/|Resources/|Scripts/|Package\.swift$|Package\.resolved$|Makefile$|mise\.toml$|\.github/workflows/)' <<<"$changed"; then
            bundle=true
          else
            bundle=false
          fi
          # The tests: main and a manual run, all of them unless only docs
          # changed; a pull request, those its changes reach.
          tests="$(./Scripts/affected-tests.sh <<<"$changed")"
          if grep -q '^\.github/workflows/ci\.yml$' <<<"$changed"; then tests=all; fi
          if [[ "$EVENT" != pull_request && "$tests" != none ]]; then tests=all; fi
          echo "tests=$tests" >>"$GITHUB_OUTPUT"
          echo "bundle=$bundle" >>"$GITHUB_OUTPUT"
          echo "::notice::tests: ${tests:0:200} — bundle: $bundle"

  test:
    needs: changes
    if: needs.changes.outputs.tests != 'none'
    runs-on: xcode-27  # public preview (see the top)
    # A cold GhosttyKit build (≈10 min, when its cache misses), the debug
    # build (≈14 min cold, ≈8 with its packages cached) and the tests (≈9
    # serial; in parallel, a few).
    timeout-minutes: 60
    # Deletes its own older build caches once it has saved a newer one.
    permissions:
      contents: read
      actions: write
    steps:
      # The whole history: each file is dated by its last commit (below).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A checkout dates every file now, so Swift Build took every source —
      # and Package.swift, so the whole build plan — for changed, a
      # restored .build or not. Dated by their last commits, the files a
      # commit didn't change read as they did when the cache was saved, and
      # only what changed and what sits above it is compiled
      # (Scripts/restore-mtimes.sh).
      - name: Date the files by their commits
        run: Scripts/restore-mtimes.sh

      # GhosttyKit's pin (Ghostty v1.4.0, Zig 0.17.0) builds with Xcode 27.2.
      - name: Use Xcode ${{ env.XCODE }}
        run: |
          # The preview image may change: say what it has if this one is missing.
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "/Applications/Xcode_$XCODE.app"

      - name: Lint (swift-format, strict)
        run: swift format lint --strict --recursive Sources Tests

      # The same cache as the Release workflow's: one key on both build
      # scripts, mise.toml (Zig) and the Xcode (its SDK and libtool).
      - name: Restore GhosttyKit and TreeSitterKit
        id: frameworks
        uses: actions/cache/restore@v6
        with:
          path: Frameworks
          key: frameworks-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'Scripts/build-treesitter.sh', 'Scripts/fetch-duckdb.sh', 'mise.toml') }}

      # Zig, pinned in mise.toml: only GhosttyKit's build uses it.
      - uses: jdx/mise-action@v5
        if: steps.frameworks.outputs.cache-hit != 'true'

      # Ghostty's shaders need the Metal toolchain, a download of its own
      # since Xcode 26 (docs/ghostty.md) — fetched only if the image lacks it.
      - name: Build GhosttyKit and TreeSitterKit
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: |
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          # A cold build fetches Ghostty's Zig packages from their upstreams,
          # and a reset connection fails it. Zig keeps what it fetched and the
          # script reuses its checkout, so a second try fetches only the rest.
          for attempt in 1 2 3; do
            make ghosttykit treesitter && break
            [[ $attempt == 3 ]] && exit 1
            echo "::warning::the frameworks' build failed (attempt $attempt); trying again in 30 s"
            sleep 30
          done

      # DuckDB's library, fetched (Scripts/fetch-duckdb.sh): kept with the
      # frameworks above; a restored one is checked and left as it is.
      - name: Fetch DuckDBKit
        run: make duckdb

      # Saved as soon as it is built, not by a post-step at the job's end: a
      # later failure or a cancel kept nothing of the ≈10-min build, and the
      # next run built it again. A second job saving the same key on the same
      # miss is refused ("already exists"), harmlessly.
      - name: Save GhosttyKit and TreeSitterKit
        if: steps.frameworks.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: Frameworks
          key: frameworks-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'Scripts/build-treesitter.sh', 'Scripts/fetch-duckdb.sh', 'mise.toml') }}

      # The whole debug build — the packages and the app's own modules, and
      # Swift Build's database (XCBuildData) that says what is up to date —
      # one entry a commit: this one's, else the newest of this
      # Package.resolved, else the newest at all (restore-keys). With the
      # files dated by their commits, only what changed since the entry's
      # commit is compiled. Each run saves its own and deletes the older
      # ones of its branch (below), so the repository's 10 GB holds main's
      # and the open pull requests' newest.
      # The layout is Swift Build's (.build/out; .build/debug a link into it).
      # An exclusion only drops a path the patterns above it listed — the
      # cache tars what is listed, folders whole — so each level is listed
      # with its globs before what leaves it out. Left out: the frameworks'
      # libraries copied in from Frameworks/ (lib*.a, 167 MB; copied again),
      # ExecutableModules (none since the app's code is a library), the
      # index store (out/v5), and Products/Release.
      # v2: the entries saved before the step below came in were built from
      # files dated older than their changes — #67's schema left uncompiled —
      # and restoring one carries that on; v2 starts clean.
      - name: Restore the debug build
        id: debug-build
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/*
            !.build/out
            .build/out/*
            !.build/out/Products
            !.build/out/v5
            .build/out/Products/Debug/*
            !.build/out/Products/Debug/ExecutableModules
            !.build/out/Products/Debug/lib*.a
          key: spm-debug-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-debug-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}-
            spm-debug-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-

      # What changed since the restored cache's commit, dated now: a branch's
      # commit can be older than the cache (Scripts/date-changed-since-cache.sh).
      - name: Date what changed since the cache
        run: Scripts/date-changed-since-cache.sh "${{ steps.debug-build.outputs.cache-matched-key }}"

      # A step of its own, so that the compile's time shows apart from the
      # tests'.
      - name: Build for tests
        id: build
        run: swift build --build-tests

      # Saved as soon as it is built, before the tests: a failing test
      # keeps it. A pull request's is its own (its branch's scope), and
      # main's every pull request restores.
      - name: Save the debug build
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.debug-build.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            .build/*
            !.build/out
            .build/out/*
            !.build/out/Products
            !.build/out/v5
            .build/out/Products/Debug/*
            !.build/out/Products/Debug/ExecutableModules
            !.build/out/Products/Debug/lib*.a
          key: spm-debug-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

      - name: Delete this branch's older debug builds
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.debug-build.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: spm-debug-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          PREFIX: spm-debug-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-
        run: Scripts/prune-caches.sh "$PREFIX" "$KEEP"

      # Several xctest processes at once (Scripts/unit-tests.sh): the tests
      # mostly wait — on fakes, timers, git — so they share the runner's
      # cores. In one process 4,344 took 507 s here. Each test's time is in
      # the logs, kept as an artifact of the run.
      - name: Unit tests
        env:
          FILTER: ${{ needs.changes.outputs.tests }}
          TEST_WORKERS: ${{ inputs.test_workers || '4' }}
          UNIT_TEST_LOGS: ${{ runner.temp }}/unit-tests
        run: |
          echo "$(sysctl -n hw.ncpu) cores"
          if [[ "$FILTER" == all ]]; then
            ./Scripts/unit-tests.sh "$TEST_WORKERS"
          else
            echo "The tests this change reaches: $FILTER"
            ./Scripts/unit-tests.sh "$TEST_WORKERS" "$FILTER"
          fi

      - name: Keep the tests' logs
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: ${{ runner.temp }}/unit-tests
          if-no-files-found: ignore

  # The release path otherwise runs only when someone releases: assemble the
  # bundle on every run that changes the app and check what the release
  # depends on — on its own machine, beside the tests.
  bundle:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: xcode-27  # public preview (see the top)
    # A cold GhosttyKit build (≈10 min, when its cache misses) and the
    # release build, over 50 min (only its package sources are cached) — the
    # first run on Xcode 27.2 was cut at 60.
    timeout-minutes: 120
    # Deletes its own older build caches once it has saved a newer one.
    permissions:
      contents: read
      actions: write
    steps:
      # The whole history: each file is dated by its last commit (below).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # As the test job's: what a commit didn't change reads as unchanged.
      - name: Date the files by their commits
        run: Scripts/restore-mtimes.sh

      - name: Use Xcode ${{ env.XCODE }}
        run: |
          # The preview image may change: say what it has if this one is missing.
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "/Applications/Xcode_$XCODE.app"

      - name: Restore GhosttyKit and TreeSitterKit
        id: frameworks
        uses: actions/cache/restore@v6
        with:
          path: Frameworks
          key: frameworks-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'Scripts/build-treesitter.sh', 'Scripts/fetch-duckdb.sh', 'mise.toml') }}

      # Zig, pinned in mise.toml: only GhosttyKit's build uses it.
      - uses: jdx/mise-action@v5
        if: steps.frameworks.outputs.cache-hit != 'true'

      # Ghostty's shaders need the Metal toolchain, a download of its own
      # since Xcode 26 (docs/ghostty.md) — fetched only if the image lacks it.
      - name: Build GhosttyKit and TreeSitterKit
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: |
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          # A cold build fetches Ghostty's Zig packages from their upstreams,
          # and a reset connection fails it. Zig keeps what it fetched and the
          # script reuses its checkout, so a second try fetches only the rest.
          for attempt in 1 2 3; do
            make ghosttykit treesitter && break
            [[ $attempt == 3 ]] && exit 1
            echo "::warning::the frameworks' build failed (attempt $attempt); trying again in 30 s"
            sleep 30
          done

      # DuckDB's library, fetched (Scripts/fetch-duckdb.sh): kept with the
      # frameworks above; a restored one is checked and left as it is.
      - name: Fetch DuckDBKit
        run: make duckdb

      # Saved as soon as it is built, not by a post-step at the job's end: a
      # later failure or a cancel kept nothing of the ≈10-min build, and the
      # next run built it again. A second job saving the same key on the same
      # miss is refused ("already exists"), harmlessly.
      - name: Save GhosttyKit and TreeSitterKit
        if: steps.frameworks.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: Frameworks
          key: frameworks-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'Scripts/build-treesitter.sh', 'Scripts/fetch-duckdb.sh', 'mise.toml') }}

      # The whole release build — the packages compiled, the app's modules,
      # Swift Build's database — one entry a commit, as the debug build's
      # (the test job). Release 44693177175 once restored a whole .build
      # and still compiled everything from the first step: the checkout
      # had dated every file, Package.swift too, now. The Release workflow
      # restores main's entry for the commit it releases.
      - name: Restore the Swift build
        id: release-build
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/*
            !.build/out
            .build/out/*
            !.build/out/Products
            !.build/out/v5
            .build/out/Products/Release/*
            !.build/out/Products/Release/lib*.a
          key: spm-release-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-release-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}-
            spm-release-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-

      # What changed since the restored cache's commit, dated now: a branch's
      # commit can be older than the cache (Scripts/date-changed-since-cache.sh).
      - name: Date what changed since the cache
        run: Scripts/date-changed-since-cache.sh "${{ steps.release-build.outputs.cache-matched-key }}"

      - name: Assemble and verify the app bundle
        id: bundle-build
        run: |
          VERSION=9.9.9 BUILD=42 make app
          test -x Overterm.app/Contents/MacOS/Overterm
          plist=Overterm.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" | grep -qx 9.9.9
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" | grep -qx 42
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" | grep -qx io.github.overcraft-hq.overterm
          codesign --verify --strict Overterm.app
          # The Swift libraries it loads by @rpath are in it (make-app.sh
          # bundles them; this runner's macOS has them, older ones don't).
          Scripts/bundle-swift-libs.sh Overterm.app >/dev/null
          # DuckDB's library, which the database client loads by @rpath.
          test -f Overterm.app/Contents/Frameworks/libduckdb.dylib
          # No end-to-end scenario nor fake server in a shipped build: they
          # are `#if E2E`, a debug build's or the E2E trait's (Package.swift).
          if nm Overterm.app/Contents/MacOS/Overterm | grep -qE 'E2ERunner|FakeDockerEngine|FakeKubeAPI'; then
            echo "::error::the release binary has the end-to-end scenarios in it"; exit 1
          fi

      # The bundle this Xcode made, to open on an older macOS than the
      # runner's before a release (1.6.2 opened on none before macOS 26).
      - name: Keep the app bundle
        run: ditto -c -k --keepParent Overterm.app Overterm-app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Overterm-app
          path: Overterm-app.zip
          retention-days: 5

      # Saved once the bundle is built and checked; a pull request's in its
      # own scope, main's for every pull request and the release.
      - name: Save the Swift build
        if: ${{ !cancelled() && steps.bundle-build.outcome == 'success' && steps.release-build.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            .build/*
            !.build/out
            .build/out/*
            !.build/out/Products
            !.build/out/v5
            .build/out/Products/Release/*
            !.build/out/Products/Release/lib*.a
          key: spm-release-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

      - name: Delete this branch's older release builds
        if: ${{ !cancelled() && steps.bundle-build.outcome == 'success' && steps.release-build.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: spm-release-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          PREFIX: spm-release-v2-${{ runner.arch }}-xcode${{ env.XCODE }}-
        run: Scripts/prune-caches.sh "$PREFIX" "$KEEP"
