# Weekly: have the dependencies pinned here had a release newer than their
# pin — the web libraries bundled into the app (the notes' reading view's,
# Excalidraw's) and the Swift packages Package.swift names? If so, open an
# issue per dependency (once per release); the bump itself is by hand.
# Logic: Scripts/check-dependencies.sh.
#
# Like the Ghostty release check: git, curl and gh on the cheapest runner,
# for a few seconds a week.
name: Dependency check

on:
  schedule:
    - cron: "15 4 * * 1"  # Mondays 07:15 Istanbul, after the Ghostty check
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare the pins with their latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./Scripts/check-dependencies.sh
