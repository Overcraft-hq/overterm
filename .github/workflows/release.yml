# Release: run it by hand (Actions → Release → Run workflow) with a version.
# It tests, builds Terminus.app, packs it in a DMG, and publishes a GitHub
# release — creating the tag v<version> on the commit it ran on — with notes
# from Scripts/release-notes.sh and the DMG attached.
#
# Manual only: a macOS runner is expensive, so nothing triggers it on push.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 — tagged v0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags and history, for the notes

      - name: Check the version and that v<version> is free
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      # Ghostty v1.3.1 (GhosttyKit's pin) builds with Xcode 16, not 26.
      - name: Use Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - uses: jdx/mise-action@v2  # Zig, pinned in mise.toml

      - name: Restore GhosttyKit
        id: ghosttykit
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: ghosttykit-${{ runner.arch }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'mise.toml') }}

      - name: Build GhosttyKit
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        run: make ghosttykit

      - name: Unit tests
        run: make test

      - name: Build Terminus.app and the DMG
        run: |
          BUILD=${{ github.run_number }} make app
          make dmg

      - name: Publish the release
        run: |
          dmg="dist/Terminus-$VERSION.dmg"
          Scripts/release-notes.sh "$VERSION" "$dmg" > notes.md
          flags=()
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" "$dmg" \
            --target "$GITHUB_SHA" \
            --title "Terminus $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
