# Release: run it by hand (Actions → Release → Run workflow) on the commit
# to ship. The version is VERSION's; the notes are its CHANGELOG.md entry
# (Scripts/release-notes.sh). It builds Overterm.app, packs it in a DMG, and
# publishes release v<version> with the DMG attached — on the tag made when
# releasing (CLAUDE.md, Commits), once pushed, or a new one on this commit.
#
# Fast, because it repeats nothing CI did. The unit tests ran in CI on this
# very commit with the same Xcode: the release asks for that run's result
# (waiting if it is still going) instead of running them again — ten minutes
# of a 30-minute release. And the release build starts from CI's: CI saves
# .build after building the app on main (the Swift packages — SwiftNIO,
# swift-crypto's BoringSSL — compiled once per Package.resolved), the release
# restores it (the packages alone: Overterm's own whole-module compile runs
# every time). The build metadata About shows is Info.plist's, not compiled
# in, so CI's build is the release's. `run_tests` runs the tests here anyway;
# `clean_build` builds without the cache.
#
# Manual only: a macOS runner is expensive, so nothing triggers it on push.
#
# On GitHub's `xcode-27` image (macOS 27), a public preview, with Xcode 27.2
# selected by path (27.1 is the image's default) — CI's machine and Xcode.
# XCODE names it for xcode-select and the cache keys, which must stay CI's:
# the caches restored here are the ones CI saved.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false
      run_tests:
        description: "Run the unit tests here too, instead of trusting CI's run on this commit"
        required: false
        type: boolean
        default: false
      clean_build:
        description: "Build without the Swift build cache"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read  # CI's run on this commit

# CI's (ci.yml): the Xcode selected, and the caches' keys.
env:
  XCODE: "27.2"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27  # public preview (see the top)
    # Up to 30 of them waiting for CI on this commit to finish, and a
    # release build without CI's cache takes over 50 (Xcode 27.2).
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number counts commits; tags

      - name: Version, tag and notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION is '$version', not MAJOR.MINOR.PATCH"; exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::release v$version already exists — bump VERSION (Scripts/bump-version.sh)"; exit 1
          fi
          # The hook's tag, if pushed, must be on this commit.
          if tagged="$(git rev-parse -q --verify "refs/tags/v$version^{commit}")"; then
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::v$version tags ${tagged:0:7}, not ${GITHUB_SHA:0:7} — run the workflow on that commit, or bump"; exit 1
            fi
          fi
          Scripts/release-notes.sh "$version" > /dev/null  # fails early without a changelog entry
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The unit tests are CI's: its run on this commit, waited for while it
      # runs. Red, cancelled (by hand, or timed out) or missing,
      # the release stops — run CI on the commit (Actions → CI → Run
      # workflow), or release with run_tests.
      - name: CI passed on this commit
        if: ${{ !inputs.run_tests }}
        run: |
          for _ in $(seq 1 60); do
            run="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 \
              --json databaseId,event,status,conclusion \
              --jq '[.[] | select(.event != "pull_request")] | first // empty')"
            if [[ -z "$run" ]]; then
              echo "::error::No CI run on ${GITHUB_SHA:0:7}: run CI on it (Actions → CI → Run workflow), or release with run_tests"; exit 1
            fi
            status="$(jq -r .status <<<"$run")"; conclusion="$(jq -r .conclusion <<<"$run")"; id="$(jq -r .databaseId <<<"$run")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then echo "CI passed on ${GITHUB_SHA:0:7} (run $id)"; exit 0; fi
              echo "::error::CI on ${GITHUB_SHA:0:7} is $conclusion (run $id): fix it, or run CI again on it"; exit 1
            fi
            echo "CI on ${GITHUB_SHA:0:7} is $status (run $id) — waiting"
            sleep 30
          done
          echo "::error::CI on ${GITHUB_SHA:0:7} didn't finish in 30 minutes"; exit 1

      # GhosttyKit's pin (Ghostty v1.4.0, Zig 0.17.0) builds with Xcode 27.2.
      - name: Use Xcode ${{ env.XCODE }}
        run: |
          # The preview image may change: say what it has if this one is missing.
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "/Applications/Xcode_$XCODE.app"

      - uses: jdx/mise-action@v5  # Zig, pinned in mise.toml

      # Frameworks/ holds both prebuilt libraries: GhosttyKit, and TreeSitterKit
      # with the editor's queries. One cache, keyed on both build scripts,
      # mise.toml and the Xcode — CI's key.
      - name: Restore GhosttyKit and TreeSitterKit
        id: frameworks
        uses: actions/cache/restore@v6
        with:
          path: Frameworks
          key: frameworks-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'Scripts/build-treesitter.sh', 'mise.toml') }}

      # The Metal toolchain for Ghostty's shaders, if the image lacks it (CI's step).
      - name: Build GhosttyKit and TreeSitterKit
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: |
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          # A cold build fetches Ghostty's Zig packages from their upstreams,
          # and a reset connection fails it. Zig keeps what it fetched and the
          # script reuses its checkout, so a second try fetches only the rest.
          for attempt in 1 2 3; do
            make ghosttykit treesitter && break
            [[ $attempt == 3 ]] && exit 1
            echo "::warning::the frameworks' build failed (attempt $attempt); trying again in 30 s"
            sleep 30
          done

      # Saved as soon as it is built (CI's step): a later failure keeps it.
      - name: Save GhosttyKit and TreeSitterKit
        if: steps.frameworks.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: Frameworks
          key: frameworks-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'Scripts/build-treesitter.sh', 'mise.toml') }}

      # CI's release build on main (see the top): its packages, for these
      # pins and this Xcode. Restored only — CI is what saves it, with these
      # very paths and key (ci.yml, bundle).
      - name: Restore the Swift build
        if: ${{ !inputs.clean_build }}
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/*
            !.build/out
            .build/out/*
            !.build/out/Intermediates.noindex
            !.build/out/Products
            !.build/out/v5
            .build/out/Intermediates.noindex/*
            !.build/out/Intermediates.noindex/Overterm.build
            .build/out/Products/Release/*
            !.build/out/Products/Release/Overterm*
            !.build/out/Products/Release/ExecutableModules
            !.build/out/Products/Release/lib*.a
          key: spm-release-${{ runner.arch }}-xcode${{ env.XCODE }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.arch }}-xcode${{ env.XCODE }}-

      # As many processes at once as CI's test job runs (ci.yml's
      # TEST_WORKERS): make test's default, one a core, was never tried on
      # this runner.
      - name: Unit tests
        if: ${{ inputs.run_tests }}
        run: make test TEST_WORKERS=4

      - name: Build Overterm.app and the DMG
        run: make app dmg

      - name: Publish the release
        run: |
          dmg="dist/Overterm-$VERSION.dmg"
          Scripts/release-notes.sh "$VERSION" "$dmg" > notes.md
          flags=(--target "$GITHUB_SHA")
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" "$dmg" --title "Overterm $VERSION" --notes-file notes.md "${flags[@]}"
