# Release: run it by hand (Actions → Release → Run workflow) on the commit
# to ship. The version is VERSION's; the notes are its CHANGELOG.md entry
# (Scripts/release-notes.sh). It tests, builds Overterm.app, packs it in a
# DMG, and publishes release v<version> with the DMG attached — on the tag
# the post-commit hook made, once pushed, or a new one on this commit.
#
# Manual only: a macOS runner is expensive, so nothing triggers it on push.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number counts commits; tags

      - name: Version, tag and notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION is '$version', not MAJOR.MINOR.PATCH"; exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::release v$version already exists — bump VERSION (Scripts/bump-version.sh)"; exit 1
          fi
          # The hook's tag, if pushed, must be on this commit.
          if tagged="$(git rev-parse -q --verify "refs/tags/v$version^{commit}")"; then
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::v$version tags ${tagged:0:7}, not ${GITHUB_SHA:0:7} — run the workflow on that commit, or bump"; exit 1
            fi
          fi
          Scripts/release-notes.sh "$version" > /dev/null  # fails early without a changelog entry
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Ghostty v1.3.1 (GhosttyKit's pin) builds with Xcode 16, not 26.
      - name: Use Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - uses: jdx/mise-action@v5  # Zig, pinned in mise.toml

      # Frameworks/ holds both prebuilt libraries: GhosttyKit, and TreeSitterKit
      # with the editor's queries. One cache, keyed on both build scripts.
      - name: Restore GhosttyKit and TreeSitterKit
        id: frameworks
        uses: actions/cache@v6
        with:
          path: Frameworks
          key: frameworks-${{ runner.arch }}-${{ hashFiles('Scripts/build-ghosttykit.sh', 'Scripts/build-treesitter.sh', 'mise.toml') }}

      - name: Build GhosttyKit and TreeSitterKit
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: make ghosttykit treesitter

      - name: Unit tests
        run: make test

      - name: Build Overterm.app and the DMG
        run: make app dmg

      - name: Publish the release
        run: |
          dmg="dist/Overterm-$VERSION.dmg"
          Scripts/release-notes.sh "$VERSION" "$dmg" > notes.md
          flags=(--target "$GITHUB_SHA")
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" "$dmg" --title "Overterm $VERSION" --notes-file notes.md "${flags[@]}"
