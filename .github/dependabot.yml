# Dependabot for Terminus.
#
# What it watches, and what it can't — documented so nobody "fixes" it by
# adding entries that only log "no dependency files":
#
# - SwiftPM: Package.swift declares no remote packages (GhosttyKit is a
#   local binary target built by `make ghosttykit`).
# - GitHub Actions: the weekly Ghostty release check's actions/checkout.
# - The real pins — Ghostty (GHOSTTY_REF/SHA in Scripts/build-ghosttykit.sh)
#   and Zig (mise.toml) — are formats Dependabot can't read. The weekly
#   ghostty-release-check workflow opens an issue when Ghostty tags a new
#   release; bump them together by hand (see CLAUDE.md).
#
# Add a `package-ecosystem: swift` block (directory: /) the day the manifest
# gains an external package — same weekly/grouped shape.
#
# Cadence matches the other promptrails repos: one batched PR per week,
# minor + patch grouped so review stays cheap; a major gets its own PR.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
